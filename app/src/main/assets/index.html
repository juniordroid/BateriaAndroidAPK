<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b11">
<title>Bateria</title>
<style>
:root{color-scheme:dark;--bg:#090b11;--panel:#111827;--line:rgba(255,255,255,.08);--text:#f7f8fb;--muted:#9aa4b7;--accent:#ffc36d;--accent2:#ff5967}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -10%,#2a0911 0,#130d16 35%,var(--bg) 100%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
.app{width:100%;height:100%;display:grid;grid-template-columns:min(27vw,300px) 1fr;gap:8px;padding:8px}.side,.stage{background:rgba(17,24,39,.9);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,.2)}.side{padding:12px;display:flex;flex-direction:column;gap:9px}.brand{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent2));font-size:21px}.title{font-size:18px;font-weight:900}.sub{font-size:10px;color:var(--muted)}.status{font-size:10px;padding:7px 9px;border-radius:999px;border:1px solid rgba(91,219,145,.2);background:rgba(61,184,111,.1);color:#83e6ab}.block{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:10px}.label{font-size:10px;color:var(--muted);margin-bottom:7px}.kits{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kit,.tool{min-height:38px;border-radius:13px;border:1px solid var(--line);background:#1b2333;color:#d8ddea;font-weight:900;font-size:12px}.kit.active{background:#f7f8fb;color:#10131a;border-color:transparent}.tool.on{background:#5d78ff;border-color:#5d78ff}.controls{display:grid;gap:8px}.slider{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.slider span{font-size:11px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hint{font-size:10px;color:var(--muted);line-height:1.3}.stage{padding:8px;display:flex;flex-direction:column;min-width:0}.canvas{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 35%,rgba(255,40,60,.12),transparent 40%),#090b10}.kitSvg{width:100%;height:100%;display:block}.part{cursor:pointer;transform-origin:center;transition:filter .1s ease}.part .shell{fill:url(#drum);stroke:#cfd4dc;stroke-width:4}.part .head{fill:url(#head);stroke:#fafafa;stroke-width:3}.part .cym{fill:url(#cym);stroke:#f3d795;stroke-width:3}.part .ring{fill:none;stroke:rgba(255,255,255,.24);stroke-width:7}.part .ink{fill:#111;opacity:.88}.part .brandTxt{fill:#f6f7fb;font-size:18px;font-weight:900;text-anchor:middle;font-style:italic}.part .small{font-size:12px}.part.active{animation:jolt .13s ease;filter:drop-shadow(0 0 18px var(--glow,#fff)) brightness(1.18)}.part.active .hitfx{opacity:1;transform:scale(1.03)}.hitfx{opacity:0;transition:.1s;transform-origin:center}.cymPart{--glow:#ffd77d}.tomPart{--glow:#ff5267}.snarePart{--glow:#ffffff}.kickPart{--glow:#ff707c}.hatPart{--glow:#81dbff}.floorPart{--glow:#ff5267}.footer{margin-top:7px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(10,14,22,.65);border:1px solid rgba(255,255,255,.05);font-size:10px;color:var(--muted)}.footer strong{color:#eff2f8}#toast{position:fixed;left:50%;bottom:12px;transform:translate(-50%,18px);background:#f7f8fb;color:#10131a;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;opacity:0;pointer-events:none;transition:.18s;z-index:99;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes jolt{0%{transform:scale(.97)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@media(max-height:430px){.side{padding:8px;gap:6px}.block{padding:8px}.kit,.tool{min-height:32px;font-size:11px}.title{font-size:15px}.sub,.hint{font-size:9px}.status{padding:5px 7px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">🥁</div><div><div class="title">Bateria</div><div class="sub">horizontal • toque direto nas peças</div></div></div>
<div class="status" id="status">toque numa peça para ativar</div>
<div class="block"><div class="label">Kits</div><div class="kits" id="kits"></div></div>
<div class="block controls"><button class="tool" id="metro">Metrônomo</button><div class="slider"><span>♩</span><input id="bpm" type="range" min="50" max="200" value="96"><span id="bpmV">96</span></div><div class="mini"><button class="tool" id="vol">Vol. 85%</button><button class="tool" id="visual">Visual ON</button></div></div>
<div class="block hint">Nesta versão, as próprias peças são os botões. Ao tocar, a peça pulsa e acende.</div>
</aside>
<main class="stage">
<div class="canvas">
<svg class="kitSvg" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="cym" cx="45%" cy="35%"><stop offset="0" stop-color="#f7dfa3"/><stop offset=".45" stop-color="#c79a49"/><stop offset="1" stop-color="#7d5522"/></radialGradient>
<radialGradient id="drum" cx="40%" cy="30%"><stop offset="0" stop-color="#470812"/><stop offset=".55" stop-color="#21060b"/><stop offset="1" stop-color="#07090d"/></radialGradient>
<radialGradient id="head" cx="45%" cy="35%"><stop offset="0" stop-color="#fbfbfb"/><stop offset="1" stop-color="#b9bec8"/></radialGradient>
</defs>
<g class="part cymPart" data-piece="crash" data-name="Crash esquerdo"><ellipse class="cym" cx="150" cy="145" rx="135" ry="105"/><ellipse class="hitfx" cx="150" cy="145" rx="135" ry="105" fill="rgba(255,230,150,.25)"/><path class="ink" d="M118 95 l22 -13 18 17 19 -25 15 30 -22 -8 -13 22 -17 -18 -23 8z"/></g>
<g class="part cymPart" data-piece="crash" data-name="Splash"><ellipse class="cym" cx="405" cy="126" rx="92" ry="70"/><ellipse class="hitfx" cx="405" cy="126" rx="92" ry="70" fill="rgba(255,230,150,.25)"/></g>
<g class="part cymPart" data-piece="crash" data-name="Crash direito"><ellipse class="cym" cx="760" cy="125" rx="112" ry="88"/><ellipse class="hitfx" cx="760" cy="125" rx="112" ry="88" fill="rgba(255,230,150,.25)"/></g>
<g class="part cymPart" data-piece="ride" data-name="Ride"><ellipse class="cym" cx="1050" cy="155" rx="140" ry="108"/><ellipse class="hitfx" cx="1050" cy="155" rx="140" ry="108" fill="rgba(255,230,150,.25)"/></g>
<g class="part hatPart" data-piece="hihat_closed" data-name="Hi-hat fechado"><ellipse class="cym" cx="108" cy="348" rx="90" ry="60"/><ellipse class="hitfx" cx="108" cy="348" rx="90" ry="60" fill="rgba(130,220,255,.22)"/></g>
<g class="part hatPart" data-piece="hihat_open" data-name="Hi-hat aberto"><ellipse class="cym" cx="100" cy="520" rx="86" ry="58"/><ellipse class="hitfx" cx="100" cy="520" rx="86" ry="58" fill="rgba(130,220,255,.22)"/></g>
<g class="part tomPart" data-piece="tom1" data-name="Tom esquerdo"><circle class="shell" cx="365" cy="310" r="102"/><circle class="ring" cx="365" cy="310" r="84"/><circle class="hitfx" cx="365" cy="310" r="79" fill="rgba(255,82,103,.24)"/><text class="brandTxt small" x="365" y="316">TOM 1</text></g>
<g class="part tomPart" data-piece="tom2" data-name="Tom central"><circle class="shell" cx="585" cy="230" r="95"/><circle class="ring" cx="585" cy="230" r="77"/><circle class="hitfx" cx="585" cy="230" r="72" fill="rgba(255,82,103,.24)"/><text class="brandTxt small" x="585" y="236">TOM 2</text></g>
<g class="part tomPart" data-piece="tom2" data-name="Tom direito"><circle class="shell" cx="795" cy="315" r="102"/><circle class="ring" cx="795" cy="315" r="84"/><circle class="hitfx" cx="795" cy="315" r="79" fill="rgba(255,82,103,.24)"/><text class="brandTxt small" x="795" y="321">TOM 3</text></g>
<g class="part kickPart" data-piece="kick" data-name="Bumbo"><circle class="shell" cx="590" cy="455" r="112"/><circle class="head" cx="590" cy="455" r="91"/><circle class="hitfx" cx="590" cy="455" r="88" fill="rgba(255,255,255,.25)"/><text class="brandTxt" x="590" y="448" fill="#111">GUIRY</text><text class="brandTxt" x="590" y="470" fill="#111">KATCHA</text></g>
<g class="part snarePart" data-piece="snare" data-name="Caixa"><circle class="shell" cx="370" cy="525" r="128"/><circle class="ring" cx="370" cy="525" r="105"/><circle class="hitfx" cx="370" cy="525" r="100" fill="rgba(255,255,255,.2)"/><text class="brandTxt" x="370" y="532">GUIRY KATCHA</text></g>
<g class="part floorPart" data-piece="floor" data-name="Surdo"><circle class="shell" cx="790" cy="530" r="128"/><circle class="ring" cx="790" cy="530" r="105"/><circle class="hitfx" cx="790" cy="530" r="100" fill="rgba(255,82,103,.22)"/><text class="brandTxt" x="790" y="537">GUIRY KATCHA</text></g>
<g class="part floorPart" data-piece="floor" data-name="Tom de chão direito"><circle class="shell" cx="1050" cy="470" r="118"/><circle class="ring" cx="1050" cy="470" r="96"/><circle class="hitfx" cx="1050" cy="470" r="91" fill="rgba(255,82,103,.22)"/></g>
</svg>
</div>
<div class="footer"><div><strong>Kit:</strong> <span id="kitName">Clássica</span></div><div>offline • multitouch • sem zoom</div></div>
</main>
</div>
<div id="toast"></div>
<script>
(()=>{'use strict';
const K={classic:{name:'Clássica',accent:'#ffc36d',kf:128,kend:42,kd:.52,sn:180,sd:.21,hp:6500,hd:.06,od:.34,tm:1,dr:.03,click:'sine'},rock:{name:'Rock',accent:'#ff707c',kf:120,kend:40,kd:.56,sn:168,sd:.24,hp:6200,hd:.07,od:.44,tm:.95,dr:.1,click:'sine'},heavy:{name:'Pesado',accent:'#b587ff',kf:112,kend:36,kd:.65,sn:164,sd:.25,hp:6800,hd:.065,od:.4,tm:.86,dr:.16,click:'square'},vintage:{name:'Vintage',accent:'#67d6e8',kf:135,kend:48,kd:.36,sn:210,sd:.16,hp:5600,hd:.05,od:.24,tm:1.08,dr:.08,click:'square'},lofi:{name:'Lo-Fi',accent:'#d6a06f',kf:106,kend:44,kd:.38,sn:145,sd:.14,hp:4200,hd:.052,od:.25,tm:.82,dr:.2,click:'sine'},brush:{name:'Brush',accent:'#77e2a9',kf:118,kend:46,kd:.34,sn:160,sd:.18,hp:3500,hd:.05,od:.22,tm:.92,dr:.02,click:'sine'}};
let ctx,master,comp,noiseBuf,kit=localStorage.getItem('kit')||'classic',bpm=+(localStorage.getItem('bpm')||96),vol=+(localStorage.getItem('vol')||.85),metroOn=false,timer,next=0,lastOpen=null,visualOn=true;const status=document.getElementById('status'),toast=document.getElementById('toast'),kitName=document.getElementById('kitName');
function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC({latencyHint:'interactive'});master=ctx.createGain();master.gain.value=vol;comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.12;master.connect(comp);comp.connect(ctx.destination);noiseBuf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*1.5),ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
async function unlock(){init();if(ctx.state!=='running')await ctx.resume();status.textContent='áudio ativo'}
function env(g,t,p,d,e=.0001){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(.0001,p),t);g.gain.exponentialRampToValueAtTime(e,t+d)}
function osc(type,f,out,t,d,p=.7,end){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+Math.min(d*.65,.32));env(g,t,p,d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03)}
function nz(out,t,d,p=.7,hp=0){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type=hp?'highpass':'lowpass';f.frequency.value=hp||12000;env(g,t,p,d);s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+d+.03)}
function drive(a){if(!a)return master;const sh=ctx.createWaveShaper(),n=256,c=new Float32Array(n),m=1+a*32;for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+m)*x/(1+m*Math.abs(x))}sh.curve=c;sh.oversample='2x';sh.connect(master);return sh}
function metal(out,t,d,v,hp,ret=false){const mix=ctx.createGain(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=hp;env(g,t,v,d);[1,1.447,1.617,1.926,2.502,2.663].forEach(r=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type='square';o.frequency.value=420*r;og.gain.value=.14;o.connect(og);og.connect(mix);o.start(t);o.stop(t+d+.03)});mix.connect(f);f.connect(g);g.connect(out);if(ret)return{stop:(at)=>{try{g.gain.cancelScheduledValues(at);g.gain.setTargetAtTime(.0001,at,.01)}catch(e){}}}}
function cym(out,t,d,v,hp,ride=false){const mix=ctx.createGain(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=hp;env(g,t,v,d);const base=ride?510:320;[1,1.31,1.57,1.83,2.18,2.61].forEach((r,i)=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=i%2?'square':'sawtooth';o.frequency.value=base*r;og.gain.value=.055;o.connect(og);og.connect(mix);o.start(t);o.stop(t+d+.04)});nz(mix,t,d*.8,.23,5000);mix.connect(f);f.connect(g);g.connect(out)}
function tom(out,t,f,d,v){osc('sine',f,out,t,d,v,f*.55);nz(out,t,.035,.12*v,1200)}
function play(piece,v=1){const t=ctx.currentTime,k=K[kit],out=drive(k.dr);switch(piece){case'kick':{const g=ctx.createGain(),o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(k.kf,t);o.frequency.exponentialRampToValueAtTime(k.kend,t+Math.min(k.kd*.5,.32));env(g,t,v,k.kd);o.connect(g);g.connect(out);o.start(t);o.stop(t+k.kd+.05);nz(out,t,.02,.08*v,1500);break}case'snare':nz(out,t,k.sd,.7*v,kit==='brush'?700:1600);osc('triangle',k.sn,out,t,k.sd*.62,.34*v,k.sn*.74);break;case'hihat_closed':if(lastOpen&&lastOpen.stop)try{lastOpen.stop(t+.01)}catch(e){}metal(out,t,k.hd,.34*v,k.hp);break;case'hihat_open':lastOpen=metal(out,t,k.od,.32*v,k.hp*.82,true);break;case'crash':cym(out,t,kit==='lofi'?.72:1.05,.42*v,2500);break;case'ride':cym(out,t,.68,.28*v,4300,true);break;case'tom1':tom(out,t,185*k.tm,.32,.7*v);break;case'tom2':tom(out,t,138*k.tm,.38,.76*v);break;case'floor':tom(out,t,98*k.tm,.52,.84*v);break}}
function flash(el){if(visualOn){el.classList.add('active');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('active'),125)}msg(el.dataset.name)}
document.querySelectorAll('.part').forEach(el=>el.addEventListener('pointerdown',async e=>{e.preventDefault();await unlock();flash(el);play(el.dataset.piece,.55+((e.pressure>0?e.pressure:1)*.55))},{passive:false}));
const row=document.getElementById('kits');Object.entries(K).forEach(([id,k])=>{const b=document.createElement('button');b.className='kit'+(id===kit?' active':'');b.dataset.kit=id;b.textContent=k.name;b.onclick=async()=>{await unlock();kit=id;localStorage.setItem('kit',id);document.documentElement.style.setProperty('--accent',k.accent);document.querySelectorAll('.kit').forEach(x=>x.classList.toggle('active',x.dataset.kit===id));kitName.textContent=k.name;msg(k.name)};row.appendChild(b)});kitName.textContent=K[kit].name;document.documentElement.style.setProperty('--accent',K[kit].accent);
const br=document.getElementById('bpm'),bv=document.getElementById('bpmV'),mb=document.getElementById('metro'),vb=document.getElementById('vol'),vis=document.getElementById('visual');br.value=bpm;bv.textContent=bpm;vb.textContent='Vol. '+Math.round(vol*100)+'%';br.oninput=()=>{bpm=+br.value;bv.textContent=bpm;localStorage.setItem('bpm',bpm)};vb.onclick=async()=>{await unlock();vol=vol>.7?.55:vol>.4?.3:.85;master.gain.setTargetAtTime(vol,ctx.currentTime,.02);vb.textContent='Vol. '+Math.round(vol*100)+'%';localStorage.setItem('vol',vol)};vis.onclick=()=>{visualOn=!visualOn;vis.textContent='Visual '+(visualOn?'ON':'OFF')};
function click(t,a=false){const g=ctx.createGain(),o=ctx.createOscillator();o.type=K[kit].click;o.frequency.value=a?1320:920;env(g,t,a?.2:.12,.042);o.connect(g);g.connect(master);o.start(t);o.stop(t+.06)}function sched(){if(!metroOn||!ctx)return;const it=60/bpm;while(next<ctx.currentTime+.12){click(next,Math.round(next/it)%4===0);next+=it}}mb.onclick=async()=>{await unlock();metroOn=!metroOn;mb.classList.toggle('on',metroOn);mb.textContent=metroOn?'Parar':'Metrônomo';if(metroOn){next=ctx.currentTime+.05;timer=setInterval(sched,25)}else{clearInterval(timer);timer=null}};
let tt;function msg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),650)}
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.scale&&e.scale!==1)e.preventDefault()},{passive:false});
})();
</script>
</body></html>
